# Mode 2 — web + api en conteneurs, MySQL externe.
# Usage : docker compose -f infra/docker/docker-compose.external-db.yml --env-file .env up -d
# DATABASE_URL doit pointer vers votre serveur MySQL existant.
name: openppm

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?definir DATABASE_URL (MySQL externe)}
      JWT_SECRET: ${JWT_SECRET:?definir JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900s}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-30}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGIN: ${APP_URL:-http://localhost:3000}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-OpenPPM <no-reply@openppm.local>}
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        # L'API est jointe en même origine via le proxy Next (nom de service compose).
        API_PROXY_TARGET: http://api:4000
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
