packages:
  - "apps/*"
  - "packages/*"
# Corrige des vulnérabilités transitives (audit) en forçant des versions patchées.
overrides:
  "multer@<2.2.0": ">=2.2.0"
  "js-yaml@<4.3.1": ">=4.3.1"
  "postcss@<8.5.23": ">=8.5.23"
  "nanoid@<3.3.17": ">=3.3.17"
  "sharp@<0.35.0": ">=0.35.0"
allowBuilds:
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  "@swc/core": true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
