# Mode 1 — tout-en-un : web + api + MySQL + Mailpit.
# Usage : cp .env.example .env && docker compose up -d
name: openppm

services:
  mysql:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?definir MYSQL_ROOT_PASSWORD dans .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openppm}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: always
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-openppm}
      JWT_SECRET: ${JWT_SECRET:?definir JWT_SECRET dans .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900s}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-30}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGIN: ${APP_URL:-http://localhost:3000}
      SMTP_URL: smtp://mailpit:1025
      SMTP_FROM: ${SMTP_FROM:-OpenPPM <no-reply@openppm.local>}
      FILES_DIR: /data/storage
    volumes:
      - files-data:/data/storage
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        # L'API est jointe en même origine via le proxy Next (nom de service compose).
        API_PROXY_TARGET: http://api:4000
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  mysql-data:
  files-data:
